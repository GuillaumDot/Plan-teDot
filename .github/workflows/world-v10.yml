name: PlaneteDot V10 contracts
on:
  push:
    branches: [dev/chatgpt-world-v10]
  pull_request:
    paths:
      - 'assets/cosmic/world-v10/**'
      - '.github/workflows/world-v10.yml'
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node assets/cosmic/world-v10/test.mjs
