name: V10 laboratory GPU tests
on:
  push:
    branches: [dev/chatgpt-v10]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gpu:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node --test tests/v10-render.test.cjs
