name: V10 WebGL
on:
  push:
    branches: [dev/chatgpt-world-v10]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.51.1
      - run: npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8080 > /tmp/v10-server.log 2>&1 &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8080/ >/dev/null && break; sleep 1; done
          node assets/cosmic/world-v10/browser-test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v10-planet-screenshots
          path: v10-*.png
          if-no-files-found: warn
