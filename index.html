<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#010208">
<title>planèteDot · ton univers musical</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400..700&display=swap" rel="stylesheet">
<style>
/* VOICE: hushed and mystical, calm like a keynote in the dark; the void does the talking
   IDEA: your music library is a living star system; playlists are planets, genres are their countries
   PICTURE: real-time WebGL cosmos: Milky Way, nebulae, lit planets with borders like a war table
   COLOUR and TYPE: black space, logo blue #3aa8ff, frosted glass; Google Sans Flex labels like Google Earth
   LAYOUT: full-bleed canvas, floating glass capsule dock, one sheet or one card rail at a time */
:root{color-scheme:dark;--ink:#f4f7ff;--mute:rgba(226,233,255,.62);--faint:rgba(226,233,255,.36);--blue:#3aa8ff;--glass:rgba(14,18,34,.34);--line:rgba(255,255,255,.1);
--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--font:"Google Sans Flex","Google Sans",-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#010208;color:var(--ink);font:16px/1.45 var(--font);overflow:hidden;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
[hidden]{display:none!important}
.hide{opacity:0!important;pointer-events:none!important}
.glass{background:var(--glass);backdrop-filter:blur(34px) saturate(180%);-webkit-backdrop-filter:blur(34px) saturate(180%);border:.5px solid rgba(255,255,255,.08);box-shadow:0 24px 70px rgba(0,0,0,.5),inset 0 .5px 0 rgba(255,255,255,.14)}
.lowfx .glass{backdrop-filter:none;-webkit-backdrop-filter:none;background:rgba(12,16,32,.9)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:disabled{opacity:.4;cursor:default}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
a{color:inherit}
svg{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
#labels{position:fixed;inset:0;pointer-events:none;transition:opacity .5s}
.lab{position:absolute;left:0;top:0;font-size:13px;font-weight:500;color:rgba(235,240,255,.75);white-space:nowrap;text-shadow:0 0 3px #000,0 0 3px #000,0 1px 8px #000;will-change:transform;text-align:center;line-height:1.25}
.lab b{display:block;font-weight:600;color:#fff;font-size:14px;letter-spacing:.01em}
.lab.star b{font-size:15px}
.lab.terr b{font-size:13px;font-weight:600}
.lab.terr{font-size:12px}
.lab .lv{display:inline-block;margin-left:4px;padding:0 6px;border-radius:8px;background:rgba(58,168,255,.25);color:#cfe8ff;font-size:11px;font-weight:600}
.lab.dim{opacity:.3!important}
#hint{position:fixed;left:0;right:0;bottom:calc(70px + var(--sab));text-align:center;font-size:15px;color:var(--mute);transition:opacity 1.4s;pointer-events:none}
#hint span{display:inline-block;animation:breath 3.4s ease-in-out infinite}
@keyframes breath{50%{opacity:.3}}
#top{position:fixed;left:0;right:0;top:0;padding:calc(12px + var(--sat)) 14px 0;display:flex;align-items:center;gap:10px;transition:opacity .6s;pointer-events:none;z-index:3}
#top>*{pointer-events:auto}
#title{flex:1;text-align:center;pointer-events:none}
#title h1{margin:0;font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#title p{margin:1px 0 0;font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#title .bar{width:min(180px,50vw);height:3px;border-radius:2px;background:rgba(255,255,255,.12);margin:6px auto 0;overflow:hidden}
#title .bar i{display:block;height:100%;background:var(--blue);border-radius:2px;transition:width .6s}
.circ{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none;transition:opacity .4s;position:relative}
.circ svg{width:20px;height:20px}
.badge{position:absolute;top:-2px;right:-2px;min-width:18px;height:18px;border-radius:9px;background:var(--blue);color:#021020;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px}
#rbtns{display:flex;gap:8px}
#dock{position:fixed;left:50%;bottom:calc(12px + var(--sab));transform:translateX(-50%);width:min(520px,calc(100% - 24px));height:64px;border-radius:32px;display:flex;align-items:center;gap:4px;padding:0 8px;transition:opacity .6s,transform .6s;z-index:3}
#dock.down{transform:translate(-50%,150%)}
.tab{width:48px;height:48px;border-radius:24px;display:grid;place-items:center;color:var(--mute);flex:none}
.tab svg{width:23px;height:23px}
#np{flex:1;display:flex;align-items:center;height:48px;padding:0 6px;border-radius:24px;text-align:left;overflow:hidden}
#np .t{flex:1;overflow:hidden}
#np b{display:block;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#np span{display:block;font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pp{position:relative;width:48px;height:48px;flex:none;display:grid;place-items:center}
#pp .ring{position:absolute;inset:0;width:48px;height:48px}
#pp .ic{width:18px;height:18px;fill:currentColor;stroke:none}
#sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,0);width:min(640px,100%);max-height:min(66vh,720px);border-radius:30px 30px 0 0;padding:4px 0 calc(14px + var(--sab));display:flex;flex-direction:column;transition:transform .6s cubic-bezier(.2,.9,.2,1),opacity .4s;z-index:5}
#sheet.off{transform:translate(-50%,108%);opacity:0;pointer-events:none}
#sheet.short{max-height:min(46vh,420px)}
#grab{width:100%;height:26px;display:grid;place-items:center;flex:none;cursor:grab;touch-action:none}
#grab i{width:38px;height:5px;border-radius:3px;background:rgba(255,255,255,.26)}
#sbody{overflow-y:auto;padding:0 20px 6px;overscroll-behavior:contain}
.sh{display:flex;align-items:flex-start;gap:10px;margin:0 0 14px}
.sh h2{margin:0;font-size:26px;line-height:1.1;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.sh p{margin:5px 0 0;color:var(--mute);font-size:15px}
.sh>div{flex:1}
.x{background:rgba(255,255,255,.09);width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none;color:var(--mute)}
.x svg{width:16px;height:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 14px}
.btn{height:44px;padding:0 20px;border-radius:22px;background:rgba(255,255,255,.12);letter-spacing:-.005em;transition:transform .15s,background .2s;font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;position:relative;overflow:hidden;white-space:nowrap}
.btn.pri{background:#f4f7ff;color:#05070f}
.btn.blue{background:var(--blue);color:#021226}
.btn.wide{flex:1}
.btn.red{color:#ff7b7b;background:rgba(255,80,80,.1)}
.btn.sm{height:36px;padding:0 14px;font-size:14px;border-radius:18px}
.btn svg{width:18px;height:18px;flex:none}
.btn input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:0}
.list{margin:0 0 6px;padding:0;list-style:none}
.tr{display:flex;align-items:center;gap:12px;min-height:58px;border-bottom:.5px solid var(--line)}
.tr .n{width:20px;text-align:right;color:var(--faint);font-size:13px;font-variant-numeric:tabular-nums;flex:none}
.tr .m{flex:1;overflow:hidden;cursor:pointer;padding:8px 0}
.tr .m b{display:block;font-weight:500;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr .m span{display:block;font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr.on .m b{color:var(--blue)}
.tr .d{font-size:13px;color:var(--faint);font-variant-numeric:tabular-nums;flex:none;white-space:nowrap}
.tr .m span.src,.src{display:inline-block;width:auto;font-size:11px;font-weight:600;padding:1px 7px;border-radius:7px;margin-left:6px;vertical-align:1px;background:rgba(255,255,255,.1);color:var(--ink);text-decoration:none}
.dots{display:flex;gap:3px;flex:none}
.dots i{width:7px;height:7px;border-radius:50%}
.ib{width:44px;height:44px;border-radius:22px;display:grid;place-items:center;color:var(--mute);flex:none}
.ib svg{width:20px;height:20px}
.chip{min-height:36px;padding:0 14px;border-radius:18px;background:rgba(255,255,255,.08);font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:8px;color:var(--mute);white-space:nowrap}
.chip.on{background:rgba(244,247,255,.94);color:#05070f}
.chip i{width:10px;height:10px;border-radius:50%;flex:none}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.empty{padding:22px 8px 26px;text-align:center;color:var(--mute);font-size:15px;text-wrap:balance}
.note{font-size:13px;color:var(--faint);margin:6px 0 12px}
.field{display:block;margin:0 0 14px}
.field>span{display:block;font-size:13px;color:var(--mute);margin:0 0 6px}
input[type=text],input[type=search],input[type=url],textarea{width:100%;min-height:48px;border-radius:14px;border:.5px solid var(--line);background:rgba(255,255,255,.07);color:var(--ink);font:16px var(--font);padding:12px 14px;-webkit-user-select:text;user-select:text;resize:none}
input::placeholder,textarea::placeholder{color:var(--faint)}
.grp{margin:0 0 18px}
.grp>h3{margin:0 0 8px;font-size:13px;font-weight:600;color:var(--mute)}
.types{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.ty{border-radius:16px;background:rgba(255,255,255,.05);padding:10px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12px;line-height:1.2;color:var(--mute);border:1px solid transparent;text-align:center}
.ty.on{border-color:rgba(255,255,255,.55);color:var(--ink);background:rgba(255,255,255,.11)}
.ty i{width:40px;height:40px;border-radius:50%;box-shadow:0 0 18px rgba(80,160,255,.25)}
.sl{display:grid;grid-template-columns:104px minmax(0,1fr) 40px;align-items:center;gap:10px;min-height:46px}
.sl label{font-size:15px}
.sl output{font-size:13px;color:var(--faint);text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:30px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:var(--trk,rgba(255,255,255,.18))}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:var(--trk,rgba(255,255,255,.18))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:#fff;margin-top:-10px;box-shadow:0 2px 10px rgba(0,0,0,.5)}
input[type=range]::-moz-range-thumb{width:26px;height:26px;border:0;border-radius:50%;background:#fff}
.hue{--trk:linear-gradient(90deg,hsl(0 85% 60%),hsl(60 85% 60%),hsl(120 85% 60%),hsl(180 85% 60%),hsl(240 85% 60%),hsl(300 85% 60%),hsl(360 85% 60%))}
.seg{display:flex;background:rgba(255,255,255,.07);border-radius:12px;padding:3px;gap:3px;flex:1}
.seg button{flex:1;height:38px;border-radius:9px;font-size:14px;color:var(--mute)}
.seg button.on{background:rgba(255,255,255,.2);color:var(--ink);font-weight:600}
.segrow{display:grid;grid-template-columns:104px minmax(0,1fr);align-items:center;gap:10px;min-height:50px}
.segrow label{font-size:15px}
.foot{position:sticky;bottom:-6px;display:flex;gap:10px;padding:12px 0 6px;background:linear-gradient(transparent,rgba(10,13,28,.94) 30%)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:0 0 16px}
.stats div{background:rgba(255,255,255,.06);border-radius:14px;padding:10px 10px 9px}
.stats b{display:block;font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.stats span{display:block;font-size:12px;color:var(--mute);margin-top:2px}
.xpbar{height:6px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden;margin:6px 0 4px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,#3aa8ff,#9fd4ff);border-radius:3px}
/* war table rail */
#rail{position:fixed;left:0;right:0;bottom:calc(86px + var(--sab));display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 max(16px,calc(50vw - 150px));transition:opacity .5s,transform .5s;z-index:4;scrollbar-width:none}
#rail::-webkit-scrollbar{display:none}
#rail.off{opacity:0;transform:translateY(30px);pointer-events:none}
.mc{flex:none;width:min(300px,78vw);scroll-snap-align:center;border-radius:24px;padding:14px 16px 14px;display:flex;flex-direction:column;gap:8px;text-align:left;border:1px solid var(--line);transition:border-color .3s,transform .3s}
.mc.sel{border-color:rgba(255,255,255,.55)}
.mc .k{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mute);font-weight:500}
.mc .k i{width:10px;height:10px;border-radius:3px;transform:rotate(45deg);flex:none}
.mc h4{margin:0;font-size:19px;font-weight:600;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mc .meta{font-size:13px;color:var(--mute);display:flex;gap:12px;flex-wrap:wrap}
.mc .lib{height:4px;border-radius:2px;background:rgba(255,255,255,.1);overflow:hidden}
.mc .lib i{display:block;height:100%;border-radius:2px}
.mc .acts{display:flex;gap:8px;margin-top:2px}
#ret{position:fixed;left:0;top:0;width:10px;height:10px;pointer-events:none;transition:opacity .4s;z-index:2}
#ret i{position:absolute;width:16px;height:16px;border:2px solid rgba(160,210,255,.85)}
#ret i:nth-child(1){left:0;top:0;border-right:0;border-bottom:0}#ret i:nth-child(2){right:0;top:0;border-left:0;border-bottom:0}
#ret i:nth-child(3){left:0;bottom:0;border-right:0;border-top:0}#ret i:nth-child(4){right:0;bottom:0;border-left:0;border-top:0}
#cross{position:fixed;left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;pointer-events:none;color:rgba(170,215,255,.8);transition:opacity .4s;z-index:2}
#filters{position:fixed;left:0;right:0;top:calc(66px + var(--sat));display:flex;gap:8px;overflow-x:auto;padding:4px 14px;scrollbar-width:none;transition:opacity .5s;z-index:3}
#filters::-webkit-scrollbar{display:none}
#filters .chip{background:rgba(12,16,32,.6);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:.5px solid var(--line)}
#filters .chip.on{background:rgba(244,247,255,.94)}
#gp{position:fixed;left:50%;bottom:calc(88px + var(--sab));transform:translateX(-50%);width:min(440px,calc(100% - 24px));border-radius:26px;padding:16px 18px 14px;transition:opacity .4s,transform .4s;z-index:4}
#gp.off{opacity:0;transform:translate(-50%,20px);pointer-events:none}
#gp h3{margin:0;font-size:20px;font-weight:600;line-height:1.15}
#gp p{margin:3px 0 10px;font-size:13px;color:var(--mute)}
#gp .chips{margin:0 0 12px;gap:6px}
#gp .chips .chip{min-height:28px;font-size:12px;padding:0 10px}
#card{position:fixed;left:50%;bottom:calc(22px + var(--sab));transform:translateX(-50%);width:min(440px,calc(100% - 24px));border-radius:30px;padding:26px 22px 20px;transition:opacity .8s,transform .8s cubic-bezier(.2,.9,.2,1);z-index:6}
#card.off{opacity:0;transform:translate(-50%,40px);pointer-events:none}
#card h2{margin:0 0 6px;font-size:27px;line-height:1.1;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
#card p{margin:0 0 18px;color:var(--mute);font-size:15px}
#card .link{display:block;margin:12px auto 0;color:var(--mute);font-size:15px;height:44px}
#toast{position:fixed;left:50%;top:calc(74px + var(--sat));transform:translateX(-50%);padding:11px 18px;border-radius:22px;font-size:14px;transition:opacity .5s;pointer-events:none;width:max-content;max-width:calc(100% - 32px);text-align:center;text-wrap:balance;z-index:9}
#flash{transition:opacity .9s ease-out;position:fixed;inset:0;background:radial-gradient(circle at 50% 50%,#e8f3ff 0,#3aa8ff 30%,rgba(10,40,120,.4) 60%,transparent 80%);opacity:0;pointer-events:none;z-index:8}
#radio{position:fixed;left:50%;top:calc(70px + var(--sat));transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:8px 16px 8px 12px;border-radius:22px;font-size:13px;max-width:calc(100% - 28px);z-index:4;transition:opacity .5s;text-align:left}
#radio b{font-weight:600}
#radio span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#radio .bars{display:flex;gap:2px;align-items:flex-end;height:16px;flex:none}
#radio .bars i{width:3px;border-radius:1px;background:var(--blue);animation:bar 1s ease-in-out infinite}
#radio .bars i:nth-child(2){animation-delay:.2s}#radio .bars i:nth-child(3){animation-delay:.4s}#radio .bars i:nth-child(4){animation-delay:.6s}
#radio.on{border-color:rgba(58,168,255,.6)}
#radio:not(.on) .bars i{animation-play-state:paused;opacity:.5}
@keyframes bar{0%,100%{height:4px}50%{height:16px}}
.ghost .m b{color:var(--faint)}
.btn:active{transform:scale(.97)}
.btn.blue{background:#0a84ff;color:#fff}
.lnk{color:#4aa3ff;font-size:15px;font-weight:500;height:44px;display:inline-flex;align-items:center;gap:4px}
.lnk::after{content:"›";font-size:20px;line-height:1;margin-top:-2px}
.spec{margin:0 0 16px;border-radius:16px;background:rgba(255,255,255,.05);padding:2px 14px}
.spec div{display:flex;justify-content:space-between;align-items:baseline;gap:16px;min-height:38px;padding:8px 0;border-bottom:.5px solid var(--line)}
.spec div:last-child{border-bottom:0}
.spec dt{font-size:15px;color:var(--mute);margin:0}
.spec dd{font-size:15px;font-weight:500;margin:0;text-align:right;font-variant-numeric:tabular-nums}
.spec dd.live{color:#4aa3ff}
.spec .bar{display:block;height:4px;border-radius:2px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:6px;width:120px;margin-left:auto}
.spec .bar i{display:block;height:100%;background:#0a84ff}
.cta{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin:0 0 12px}
.cta .btn{width:100%}
.mc .btn{flex:1}
.big{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;height:88px;border-radius:20px;background:rgba(10,132,255,.16);border:1px dashed rgba(74,163,255,.6);color:#cfe6ff;font-weight:600;font-size:16px;position:relative;width:100%}
.big svg{width:24px;height:24px}
.big input{position:absolute;inset:0;opacity:0;cursor:pointer}
.lb{position:fixed;left:0;right:0;height:0;background:#000;z-index:20;transition:height 1.1s cubic-bezier(.4,0,.2,1);pointer-events:none}
#lbT{top:0}#lbB{bottom:0}
body.cine .lb{height:0}
body.cine #top,body.cine #dock,body.cine #rail,body.cine #radio,body.cine #toast,body.cine #labels,body.cine #gp,body.cine #filters,body.cine #sheet,body.cine #card,body.cine #ret,body.cine #cross{opacity:0!important;pointer-events:none!important;transition:opacity .9s}
#cineCatch{position:fixed;inset:0;z-index:21;display:none}
body.cine #cineCatch{display:block}
#cineCap{position:fixed;left:6vw;bottom:calc(36px + var(--sab));z-index:22;color:#fff;opacity:0;transition:opacity 1.6s;pointer-events:none;text-shadow:0 2px 16px #000}
#cineCap b{display:block;font-size:22px;font-weight:600;letter-spacing:-.01em}
#cineCap span{font-size:14px;color:rgba(235,240,255,.75)}
#cineFade{position:fixed;inset:0;background:#000;opacity:0;z-index:19;pointer-events:none;transition:opacity .45s}
.lab.live b{color:#8cc8ff}
.circ.glass{background:rgba(255,255,255,.07);box-shadow:none}
#bLib img{width:30px;height:30px;object-fit:cover;border-radius:50%;filter:drop-shadow(0 0 6px rgba(58,168,255,.6))}
.tabs{display:flex;gap:8px;margin:0 0 16px}
.tabs button{height:34px;padding:0 16px;border-radius:17px;background:rgba(255,255,255,.08);font-size:14px;font-weight:600;color:var(--mute)}
.tabs button.on{background:#f4f7ff;color:#05070f}
.pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 12px;margin:0 0 12px}
.pcard{text-align:left;display:flex;flex-direction:column;gap:6px;position:relative}
.pcard b{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* v23 */

#gp,#card,#evo,#mpanel{transition:transform .65s cubic-bezier(.16,1,.3,1),opacity .45s ease,filter .5s ease}
#gp.off{transform:translate(-50%,14px) scale(.96);filter:blur(8px)}#card.off{filter:blur(8px);scale:.97}

function clean(name){ return name.replace(/\.[^.]+$/, '').replace(/[_]+/g, ' ').replace(/^\d{1,3}[\s.\-]+/, '').trim(); }

/* V5: publication explicite de fichiers audio, sans publication automatique des imports.
   Les objets privés restent exclusivement dans le bucket privé; le bucket partagé est public. */
const PD_REMOTE={rows:[],owner:null};
async function pdPublishPlanetAudio(p){
  if(!sb || !authUser || !p || p.isPublic===false){toast('Connexion et planète publique nécessaires');return;}
  let ok=0,fail=0;
  for(const id of p.tracks){
    const t=TRACKS.get(id);if(!t){fail++;continue;}
    try{
      if(!t.blob && !(await ensureBlob(t))){fail++;continue;}
      const path=authUser.id+'/'+encodeURIComponent(t.id)+'.mp3';
      const type=t.blob.type||'audio/mpeg';
      const {error:upErr}=await sb.storage.from('planetedot-shared').upload(path,t.blob,{contentType:type,upsert:true});
      if(upErr)throw upErr;
      const {error:dbErr}=await sb.from('shared_tracks').upsert({owner_id:authUser.id,track_id:t.id,title:t.title.slice(0,80),artist:(t.artist||'').slice(0,60),audio_path:path,duration_seconds:t.dur||0},{onConflict:'owner_id,track_id'});
      if(dbErr)throw dbErr;
      ok++;
    }catch(e){fail++;console.warn('Partage audio:',e);}
  }
  toast(ok+' audio(s) public(s) partagé(s)'+(fail?' · '+fail+' échec(s)':''),5000);
}
async function pdRevokePlanet(p){
  if(!sb || !authUser || !p)return false;
  let success=true;
  const ids=[...new Set(p.tracks)];
  for(const id of ids){
    try{
      const {data}=await sb.from('shared_tracks').select('audio_path').eq('owner_id',authUser.id).eq('track_id',id);
      if(data?.length){const {error:removeErr}=await sb.storage.from('planetedot-shared').remove(data.map(x=>x.audio_path));if(removeErr)throw removeErr;const {error:deleteErr}=await sb.from('shared_tracks').delete().eq('owner_id',authUser.id).eq('track_id',id);if(deleteErr)throw deleteErr;}
    }catch(e){success=false;console.warn('Révocation audio:',e);}
  }
  return success;
}
async function pdPlayRemotePlanet(p,index=0){
  if(!p || p.isPublic===false){toast('🔒 Audio privé');return;}
  if(!ownerId || !sb){toast('Audio distant indisponible');return;}
  try{
    const {data,error}=await sb.from('shared_tracks').select('track_id,title,artist,audio_path').eq('owner_id',ownerId).limit(300);
    if(error)throw error;
    const rows=(p.tracksRO||[]).map(x=>(data||[]).find(t=>t.title===x[0]&&t.artist===(x[1]||''))).filter(Boolean);
    if(!rows.length){toast('Aucun fichier audio public publié pour cette planète');return;}
    pdRemoteStart(rows,Math.min(index,rows.length-1),ownerId,p.name);
  }catch(e){console.warn(e);toast('Écoute publique indisponible');}
}
async function pdPlayRemoteGalaxy(){
  if(!ownerId||!sb)return;
  const ps=VIEW.planets.filter(p=>p.isPublic!==false);
  try{
    const {data,error}=await sb.from('shared_tracks').select('track_id,title,artist,audio_path').eq('owner_id',ownerId).limit(300);
    if(error)throw error;

  window.PD_EFFECTS={ready,play,wake,diagnostics:()=>({state:ctx?.state||'absent',mode:typeof mode==='undefined'?'unknown':mode,ambience:SND.amb,sceneGain:sceneBus?.gain.value||0})};
  function add(){
    if(document.getElementById('pd-audio-test'))return;
    const b=document.createElement('button');b.id='pd-audio-test';b.type='button';b.textContent='♫ Tester le son';
    b.style.cssText='position:fixed;right:12px;bottom:calc(76px + env(safe-area-inset-bottom, 0px));z-index:9999;background:#0d1f39;color:#d9f5ff;border:1px solid #6ed2ff;border-radius:22px;padding:10px 14px;font:600 12px system-ui';
    b.onclick=async()=>{
      try{const c=await wake();playNotes(c);b.textContent='♫ '+c.state+' · ambiance '+(SND.amb?'ON':'OFF')+' · '+(typeof mode==='undefined'?'?':mode);setTimeout(()=>b.textContent='♫ Tester le son',3500);}
      catch(e){lastError=String(e&&e.message||e);b.textContent='Erreur : '+lastError;b.title=lastError;console.error('PlanèteDot audio V5.4',e);}
    };
    document.body.appendChild(b);
  }
  // First genuine touch/click unlocks this independent context; never block UI.
  function gesture(){wake().catch(e=>{lastError=String(e&&e.message||e);console.warn('PlanèteDot ambience',lastError)});}
  document.addEventListener('click',e=>{
    if(!ready() || e.target.closest('#pd-audio-test'))return;
    if(e.target.closest('button,[role="button"],a,input,select'))play('tap');
  },{passive:true});
  document.addEventListener('pointerdown',gesture,{once:true,passive:true});
  document.addEventListener('touchstart',gesture,{once:true,passive:true});
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&ctx&&ctx.state==='suspended')ctx.resume().then(update).catch(()=>{});else update()});
  setInterval(update,450);
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',add,{once:true});else add();
})();

/* V5.7: repair ambience preferences and celestial transitions. */
/* V5.6 experimental: contextual ambient layers for planets, stars, moons and territories. */
/* V5.1 experimental: owner playback presence, visitor radio, no private track broadcast. */
const PDLIVE={owner:null,track:null,seen:0,active:false,fetching:false,lastPublish:0};
async function pdLivePublish(){
  if(!sb||!authUser||!SYS)return;
  const id=Q?.[qi], playing=!!id&&!au.paused&&!au.ended&&!String(id).startsWith('pd-public:');
  try{
    const {data}=await sb.from('shared_tracks').select('track_id').eq('owner_id',authUser.id).eq('track_id',id||'').maybeSingle();
    await sb.from('pd_live_playback').upsert({owner_id:authUser.id,track_id:playing&&data?id:null,position_seconds:playing&&data?Math.floor(au.currentTime||0):0,is_playing:!!(playing&&data),updated_at:new Date().toISOString()},{onConflict:'owner_id'});
  }catch(e){console.warn('Live playback',e)}
}
async function pdLivePoll(){
  if(!sb||!readonly||!ownerId||PDLIVE.fetching)return;
  PDLIVE.fetching=true;
  try{
    const {data,error}=await sb.from('pd_live_playback').select('track_id,position_seconds,is_playing,updated_at').eq('owner_id',ownerId).maybeSingle();
    if(error)throw error;
    const valid=data?.is_playing&&data.track_id&&Date.now()-new Date(data.updated_at).getTime()<40000;
    const btn=document.getElementById('pd-live-radio');
    if(btn){btn.style.display=valid?'block':'none';btn.textContent=valid?(PDLIVE.owner===ownerId&&PDLIVE.track===data.track_id?'◉ Radio galaxie en cours':'♫ Écouter la radio de cette galaxie'):'♫ Radio inactive';}
    if(!valid){PDLIVE.active=false;return;}
    if(PDLIVE.active&&PDLIVE.owner===ownerId&&PDLIVE.track!==data.track_id)await pdLiveTune(data);
    if(PDLIVE.active&&PDLIVE.owner===ownerId&&PDLIVE.track===data.track_id&&!au.paused&&Math.abs((au.currentTime||0)-Number(data.position_seconds||0))>14){try{au.currentTime=Number(data.position_seconds||0)}catch(e){}}
  }catch(e){console.warn('Radio visite',e)}finally{PDLIVE.fetching=false;}
}
async function pdLiveTune(state){
  if(!sb||!ownerId||!state?.track_id)return;
  const owner=ownerId;
  const {data,error}=await sb.from('shared_tracks').select('track_id,title,artist,audio_path').eq('owner_id',owner).eq('track_id',state.track_id).maybeSingle();
  if(error||!data){toast('Cette musique n’est pas partagée publiquement');return;}
  pdRemoteStart([data],0,owner,VIEW?.name||'galaxie');
  PDLIVE.owner=owner;PDLIVE.track=state.track_id;PDLIVE.active=true;
  au.addEventListener('loadedmetadata',function align(){au.removeEventListener('loadedmetadata',align);try{au.currentTime=Math.min(Math.max(0,Number(state.position_seconds||0)),Math.max(0,(au.duration||0)-1))}catch(e){}},{once:true});
}
async function pdLiveClick(){
  if(!readonly||!ownerId)return;
  try{const {data}=await sb.from('pd_live_playback').select('track_id,position_seconds,is_playing,updated_at').eq('owner_id',ownerId).maybeSingle();if(data?.is_playing&&Date.now()-new Date(data.updated_at).getTime()<40000)await pdLiveTune(data);else toast('La galaxie ne diffuse pas actuellement');}catch(e){toast('Radio indisponible')}
}
(function(){
  const b=document.createElement('button');b.id='pd-live-radio';b.type='button';b.textContent='♫ Radio galaxie';b.onclick=pdLiveClick;document.body.appendChild(b);
  const style=document.createElement('style');style.textContent='#pd-live-radio{display:none;position:fixed;bottom:calc(95px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:30;border:1px solid rgba(140,205,255,.5);border-radius:30px;background:rgba(7,22,45,.82);color:#e8f6ff;padding:12px 20px;backdrop-filter:blur(18px);box-shadow:0 0 32px rgba(75,160,245,.22);font:600 13px system-ui;max-width:90vw;white-space:nowrap}';document.head.appendChild(style);
  setInterval(()=>{const now=Date.now();if(authUser&&now-PDLIVE.lastPublish>12000){PDLIVE.lastPublish=now;pdLivePublish()}if(readonly){pdLivePoll()}else{b.style.display='none';PDLIVE.active=false}},6000);
  au.addEventListener('play',()=>{if(authUser)pdLivePublish()});
  au.addEventListener('pause',()=>{if(authUser)pdLivePublish()});
  au.addEventListener('ended',()=>{if(authUser)pdLivePublish()});
})();
