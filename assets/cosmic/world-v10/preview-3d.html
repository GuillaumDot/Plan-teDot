<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PlanèteDot V10 3D</title><style>body{margin:0;background:#080b15;color:#fff;font:16px system-ui;text-align:center}canvas{width:min(95vw,560px);height:min(95vw,560px);display:block;margin:auto;touch-action:none;cursor:grab}canvas:active{cursor:grabbing}select,button{font:inherit;min-height:44px;margin:8px}#status{padding:12px}</style><h1>PlanèteDot V10</h1><select aria-label="Famille planétaire" id="family"></select><button id="motion">Pause</button><label for="quality">Qualité</label><select id="quality"><option value="auto">Auto</option><option value="0">Éco</option><option value="1">Standard</option><option value="2">Élevée</option><option value="3">Ultra</option></select><label for="growth">Évolution urbaine</label> <input id="growth" type="range" min="0" max="100" value="100" aria-label="Évolution urbaine"><div><button id="zoomout" aria-label="Éloigner">−</button><button id="zoomin" aria-label="Rapprocher">+</button><button id="resetview">Recentrer</button></div><canvas id="view" aria-label="Planète interactive" tabindex="0"></canvas><p>Glisser pour tourner · pincer pour zoomer</p><p id="status" role="status">Chargement…</p><script type="module">
import {createPlanetRenderer} from './renderer.mjs';
import {createWorldCache} from './world-cache.mjs';
import {ARCHETYPES} from './archetypes.mjs';
import {cameraTarget,cameraStep,cameraFrame} from './camera.mjs';
import {qualityStep} from './transitions.mjs';
import {renderBudget,WORLD_CONFIG} from './config.mjs';
const canvas=document.querySelector('#view'),status=document.querySelector('#status'),select=document.querySelector('#family'),button=document.querySelector('#motion');
for(const [i,type] of Object.keys(ARCHETYPES).entries())select.add(new Option(['Terre','Aquatique','Roche','Volcanique','Glace','Gaz','Spectrale métallique'][i],type));
let renderer,cache,planet,request=0,raf=0,paused=matchMedia('(prefers-reduced-motion: reduce)').matches,elapsed=0,last=0,closed=false,detailAbort;
const quality=document.querySelector('#quality');let governor={tier:2,average:1000/WORLD_CONFIG.targetFPS};
quality.onchange=()=>{governor={tier:quality.value==='auto'?2:Number(quality.value),average:1000/WORLD_CONFIG.targetFPS};last=0;};
document.addEventListener('visibilitychange',()=>{last=0;});
const reduced=matchMedia('(prefers-reduced-motion: reduce)');
let target={yaw:0,pitch:0,zoom:1},camera={...target};const pointers=new Map();
function change(delta){target=cameraTarget(target,delta);}
function measure(){const a=[...pointers.values()];return a.length===2?Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y):0;}
canvas.addEventListener('pointerdown',e=>{if(pointers.size>=2)return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});canvas.setPointerCapture(e.pointerId);});
canvas.addEventListener('pointermove',e=>{const old=pointers.get(e.pointerId);if(!old)return;const before=measure();pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});const after=measure();if(before>0&&after>0)change({zoom:after/before});else if(pointers.size===1)change({yaw:(e.clientX-old.x)*.008,pitch:(e.clientY-old.y)*.008});});
for(const event of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(event,e=>pointers.delete(e.pointerId));
canvas.addEventListener('wheel',e=>{e.preventDefault();change({zoom:Math.exp(-Math.max(-300,Math.min(300,e.deltaY))*.002)});},{passive:false});
document.querySelector('#zoomin').onclick=()=>change({zoom:1.25});
document.querySelector('#zoomout').onclick=()=>change({zoom:.8});
document.querySelector('#resetview').onclick=()=>{target={yaw:0,pitch:0,zoom:1};};
canvas.addEventListener('keydown',e=>{const actions={ArrowLeft:{yaw:-.15},ArrowRight:{yaw:.15},ArrowUp:{pitch:-.15},ArrowDown:{pitch:.15},'+':{zoom:1.25},'-':{zoom:.8}};if(Object.hasOwn(actions,e.key)){e.preventDefault();change(actions[e.key]);}});
const gl=canvas.getContext('webgl',{alpha:false,antialias:true});
function cleanup(){closed=true;detailAbort?.abort();cancelAnimationFrame(raf);planet?.dispose();renderer?.dispose();cache?.dispose();}
try{if(!gl)throw Error('WebGL indisponible');renderer=await createPlanetRenderer(gl);cache=createWorldCache();
async function load(){const id=++request;detailAbort?.abort();const controller=new AbortController();detailAbort=controller;status.textContent='Génération…';try{const world=await cache.get(select.value,42,64,{priority:true});if(closed||id!==request)return;const next=renderer.upload(world);planet?.dispose();planet=next;canvas.dataset.detail='loading';canvas.dataset.models='loading';canvas.dataset.vegetation='loading';void next.loadVegetation({signal:controller.signal}).then(ok=>{if(id===request&&!closed)canvas.dataset.vegetation=ok?'ready':'none';}).catch(e=>{if(id===request&&!closed){canvas.dataset.vegetation='fallback';console.warn('Vegetation fallback:',e.message);}});void next.loadLandmarks({signal:controller.signal}).then(ok=>{if(id===request&&!closed)canvas.dataset.models=ok?'ready':'none';}).catch(e=>{if(id===request&&!closed){canvas.dataset.models='fallback';console.warn('Model fallback:',e.message);}});canvas.dataset.detailMode='none';status.textContent='Planète chargée';try{const ok=await next.loadDetail(world.natural?.detailBiome,{maxSize:256,signal:controller.signal});if(id===request&&!closed){canvas.dataset.detail=ok?'ready':'none';canvas.dataset.detailMode=next.detail?.atlas?'atlas':ok?'single':'none';}}catch(e){if(id===request&&!closed){canvas.dataset.detail='fallback';console.warn('Detail texture fallback:',e.message);}}}catch(e){if(id===request&&!closed)status.textContent=e.message;}}
select.onchange=load;button.textContent=paused?'Animer':'Pause';button.onclick=()=>{paused=!paused;button.textContent=paused?'Animer':'Pause';};
function frame(t){if(closed)return;const raw=last?Math.max(0,t-last):0;last=t;if(document.hidden){last=0;raf=requestAnimationFrame(frame);return;}const dt=Math.min(.05,raw/1000);if(planet&&quality.value==='auto'&&raw>0&&raw<250&&status.textContent==='Planète chargée'&&canvas.dataset.detail!=='loading')governor=qualityStep(governor,raw,raw/1000,1000/WORLD_CONFIG.targetFPS);const tier=governor.tier,budget=renderBudget(tier,devicePixelRatio,reduced.matches);canvas.dataset.tier=String(tier);if(!paused){if(!pointers.size)change({yaw:dt*.2});elapsed+=dt;}camera=cameraStep(camera,target,dt,reduced.matches);canvas.dataset.zoom=camera.zoom.toFixed(3);const size=Math.min(840,Math.round(canvas.clientWidth*budget.pixelRatio));if(canvas.width!==size||canvas.height!==size)canvas.width=canvas.height=size;gl.viewport(0,0,size,size);gl.clearColor(.025,.035,.07,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);gl.enable(gl.DEPTH_TEST);if(planet){renderer.draw(planet,{...cameraFrame(camera),tier,detailStrength:[.45,.65,.8,.8][tier],time:elapsed,delta:paused?0:dt,growth:Number(document.querySelector('#growth').value)/100});}raf=requestAnimationFrame(frame);}
canvas.addEventListener('webglcontextlost',e=>{e.preventDefault();cleanup();status.textContent='Contexte perdu : rechargez la page.';});addEventListener('pagehide',cleanup,{once:true});await load();raf=requestAnimationFrame(frame);
}catch(e){cleanup();status.textContent=e.message;}
</script></html>
