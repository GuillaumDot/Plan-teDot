<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PlanèteDot V10 — aperçu</title><style>body{background:#080b15;color:#eee;font:16px system-ui;margin:20px}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:16px}figure{margin:0;text-align:center}canvas{width:100%;max-width:240px}figcaption{padding:8px}</style><h1>PlanèteDot V10</h1><p>Prototype des surfaces — rendu CPU statique</p><main></main><script type="module">
import {makeSurface} from './surface.mjs';
import {ARCHETYPES} from './archetypes.mjs';
const labels=['Tellurique','Aquatique','Rocheuse','Volcanique','Glaciaire','Gazeuse','Spectrale métallique'];
const mix=(a,b,t)=>a.map((v,i)=>v+(b[i]-v)*t);
for(const [i,type] of Object.keys(ARCHETYPES).entries()){
 const f=document.createElement('figure'),c=document.createElement('canvas'),label=document.createElement('figcaption');c.width=c.height=192;label.textContent=labels[i];f.append(c,label);document.querySelector('main').append(f);
 const ctx=c.getContext('2d'),im=ctx.createImageData(192,192),sample=makeSurface(type,42);
 for(let y=0;y<192;y++)for(let x=0;x<192;x++){const u=(x-95.5)/89,v=(95.5-y)/89,r=u*u+v*v;if(r>1)continue;const z=Math.sqrt(1-r),p=sample(u,v,z);let col=mix([65,48,39],[160,135,110],p.height);
 if(i<2){col=mix(mix([165,132,70],[38,110,53],p.humidity*p.heat),mix([12,40,100],[25,145,155],p.height),p.water);col=mix(col,[225,240,250],p.ice);}
 if(i===3)col=mix([42,30,27],[255,76,10],p.emission);
 if(i===4)col=mix([25,95,150],[220,239,250],p.ice);
 if(i===5)col=mix([100,58,35],[235,196,142],p.cloud);
 if(i===6)col=mix([48,52,85],[175,180,205],p.metal);
 const light=.12+.88*Math.max(0,-.45*u+.35*v+.82*z),k=(y*192+x)*4;for(let j=0;j<3;j++)im.data[k+j]=col[j]*light;im.data[k+3]=255;}
 ctx.putImageData(im,0,0);await new Promise(requestAnimationFrame);
}
</script></html>
